<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Birthday Surprise 💖</title>
    <style>
        :root {
            --primary-pink: #ff85a1;
            --soft-pink: #fbb1bd;
            --bg-color: #E0FFFF;
            --text-color: #5d5d5d;
            --accent-gold: #d4af37;
        }

        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Floating Hearts Background */
        .heart {
            position: absolute;
            color: var(--primary-pink);
            font-size: 20px;
            animation: float 4s linear infinite;
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 900px;
            text-align: center;
            padding: 20px;
        }

        .hidden { display: none !important; }

        /* First Page: 3 Gift Boxes */
        .gift-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        .gift-wrapper {
            cursor: pointer;
            transition: transform 0.3s;
        }

        .gift-wrapper:hover { transform: scale(1.1); }

        .gift-icon {
            font-size: 80px;
            display: block;
        }

        .gift-label {
            display: block;
            margin-top: 10px;
            color: var(--primary-pink);
            font-weight: bold;
            font-size: 14px;
            background: white;
            padding: 5px 10px;
            border-radius: 15px;
        }

        /* Second Page: Card Frame */
        .card-frame {
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 133, 161, 0.2);
            border: 6px double var(--soft-pink);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-height: 85vh;
            overflow-y: auto;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .card-content {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 25px;
            text-align: left;
            flex-wrap: wrap;
        }

        .card-img-frame {
            position: relative;
            padding: 10px;
            background: #fff;
            border: 1px solid #eee;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transform: rotate(-3deg);
            flex-shrink: 0;
        }

        .card-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            display: block;
            border-radius: 8px;
        }

        .card-text-wrapper {
            flex: 1;
            min-width: 250px;
            display: flex;
            justify-content: center;
        }

        .card-text {
            color: var(--text-color);
            font-size: 16px;
            line-height: 1.8;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 12px;
            padding-left: 10px;
            text-align: left;
            width: 100%;
            max-width: 450px;
        }

        .card-text::-webkit-scrollbar {
            width: 8px;
        }

        .card-text::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .card-text::-webkit-scrollbar-thumb {
            background: var(--soft-pink);
            border-radius: 10px;
        }

        .card-text::-webkit-scrollbar-thumb:hover {
            background: var(--primary-pink);
        }

        .back-btn {
            margin-top: 25px;
            padding: 10px 25px;
            background-color: var(--primary-pink);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
            flex-shrink: 0;
        }

        .back-btn:hover { background-color: #ff5e84; }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .card-content { 
                flex-direction: column; 
                text-align: center;
                gap: 20px;
            }

            .card-img { 
                width: 180px; 
                height: 180px; 
            }

            .card-img-frame { 
                transform: rotate(0deg);
                margin: 0 auto;
            }

            .gift-icon { 
                font-size: 60px; 
            }

            .card-text { 
                text-align: center;
                max-height: 300px;
                max-width: 100%;
            }

            .card-frame {
                padding: 20px;
                max-height: 90vh;
            }

            .container {
                max-width: 95%;
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .card-img { 
                width: 150px; 
                height: 150px; 
            }

            .card-text {
                font-size: 15px;
                line-height: 1.6;
                max-height: 250px;
            }

            .card-frame {
                padding: 15px;
            }

            .gift-icon { 
                font-size: 50px; 
            }

            h1 {
                font-size: 24px !important;
            }
        }
    </style>
</head>
<body>
<audio id="bgm" loop>
  <source src="daylight.mp3" type="audio/mpeg">
</audio>

<script>
window.addEventListener("click", () => {
  const music = document.getElementById("bgm");
  music.play();
}, { once: true });
</script>
    <div id="page1" class="container">
        <h1 style="color: var(--primary-pink); text-shadow: 1px 1px white;">Choose Your Gift 🎁</h1>
         <p style="color: #2F4F4F;">Happy Birthday ပါ ကိုကို❤️</p>
        
        <p style="color: #2F4F4F;">Boxလေးတွေကို တစ်ခုချင်းနှိပ်ကြည့်ပါဦးနော်</p>
        
        <div class="gift-container">
            <div class="gift-wrapper" onclick="openGift(0)">
                <span class="gift-icon">🎁</span>
                <span class="gift-label">Box 1</span>
            </div>
            <div class="gift-wrapper" onclick="openGift(1)">
                <span class="gift-icon">🎀</span>
                <span class="gift-label">Box 2</span>
            </div>
            <div class="gift-wrapper" onclick="openGift(2)">
                <span class="gift-icon">💝</span>
                <span class="gift-label">Box 3</span>
            </div>
        </div>
    </div>

    <div id="page2" class="container hidden">
        <div class="card-frame">
            <div class="card-content">
                <div class="card-img-frame">
                    <img id="display-img" src="" alt="photo" class="card-img">
                </div>
                <div class="card-text-wrapper">
                    <div class="card-text">
                        <p id="display-wish"></p>
                    </div>
                </div>
            </div>
            <button class="back-btn" onclick="goBack()">နောက်ထပ်boxဖွင့်မယ် ➔</button>
        </div>
    </div>

    <script>
        
        const giftData = [
            {
                img: "u.jpg", 
                wish: "<b>Wish You</b><br><br>\"ကိုကို့ရဲ့မွေးနေ့ကစပြီး နောက်နှစ်ပေါင်းများစွာတိုင်အောင် ပျော်ရွှင်စရာတွေ၊ အောင်မြင်မှုတွေပဲ ကိုကို့ဆီ အရောက်လာပါစေလို့ ဆုတောင်းပေးပါတယ်။ ကိုကိုနဲ့ဆုံခဲ့ရတဲ့နေ့ကစပြီး အခုထက်ထိ ကိုကိုဟာ ကိုယ့်ဘဝရဲ့ စိတ်အေးချမ်းရဆုံး နေရာလေးတစ်ခု ဖြစ်ခဲ့ပါတယ်။<br><br>အမြဲတမ်း ကိုယ့်အနားမှာ ရှိပေးပြီး ဂရုစိုက်ပေးလို့၊ နားလည်ပေးလို့လည်း တကယ်ကျေးဇူးတင်ပါတယ်။ နောက်ထပ်ကျရောက်မယ့် မွေးနေ့တွေအများကြီးမှာလည်း ကိုကို့လက်ကို အမြဲတွဲပြီး ဘေးနားကနေ အတူတူ ဖြတ်သန်းသွားချင်ပါတယ်။<br><br>ကိုယ့်ထက် ကိုကို့ကိုယ်ကို ပိုချစ်ပေးပါ၊ ကျန်းမာရေးလည်း ဂရုစိုက်ပါနော်။ မွေးနေ့ကစပြီး စိတ်ချမ်းသာခြင်း၊ ကိုယ်၏ကျန်းမာခြင်းတွေနဲ့ ပြည့်စုံပြီး လိုအင်ဆန္ဒတွေအကုန် ပြည့်ဝပါစေ။....ချစ်တဲ့ကိုကို💗\""
            },
            {
                img: "us.jpg", 
                wish: "<b>For You</b><br><br>\"ကိုကို့ကို ဘဝတစ်လျှောက်လုံး စိတ်ချမ်းသာအောင် ထားပါ့မယ်လို့ ကတိပေးပါတယ် ကိုကို။ ကိုကို အလုပ်တွေကြောင့်ဖြစ်ဖြစ်၊ လောကဓံကြောင့်ဖြစ်ဖြစ် မောပန်းနွမ်းနယ်လာတဲ့အခါတိုင်း ကိုယ့်ရင်ခွင်က ကိုကို့အတွက် အနားယူရာ စိတ်အေးချမ်းရဆုံး နေရာလေး ဖြစ်စေရပါမယ်။<br><br>ကိုကို့ရဲ့ ဝမ်းနည်းစရာတွေ၊ ပျော်ရွှင်စရာတွေ အားလုံးကို အတူတူ မျှဝေခံစားပြီး အေးအတူပူအမျှ ရှေ့ဆက်သွားကြမယ်နော်။ ကိုကို့ကို စိတ်ညစ်အောင် မလုပ်ဘဲ အမြဲတမ်း နားလည်ပေးနိုင်တဲ့ ချစ်သူ ဖြစ်အောင်လည်း ကြိုးစားသွားမှာပါ။<br><br>ဘယ်တော့မှ ပစ်မသွားဘူးဆိုတဲ့ ကတိကို ယုံကြည်ပြီး ကိုယ့်လက်ကို စိတ်ချလက်ချနဲ့ အမြဲမြဲမြံစွာ တွဲထားပေးပါနော်။🥺💕\""
            },
            {
                img: "uu.jpg",
                wish: "<b>Promise</b><br><br>\"ကိုကို ဘေဘီအပေါ်ပေးတဲ့ အချစ်တွေနဲ့ ဂရုစိုက်မှုတွေအတွက် အများကြီး ကျေးဇူးတင်တယ်နော်။ ကိုယ် ကိုကို့ကို ခိုင်လုံတဲ့ ချစ်ခြင်းမေတ္တာနဲ့ အမြဲတမ်း သဘောတူညီရင်း ဝမ်းသာစွာ ရှေ့သွားကြမယ်။<br><br>ဆန္ဒနဲ့ဘ၀ထပ်တူကျပြီး စိတ်ချမ်းသာကိုယ်ကျန်းမာနဲ့ဘ၀ကိုဖြတ်သန်းပြီးချစ်ရတဲ့မိသားစုနဲ့လည်းပျော်ရွင်နိုင်ပါစေကိုကို။<br><br>I just want to thank you for all the love and warmth you bring into my life. Thank you for your endless patience, your gentle hugs, and the way you always understand me. Your love is the best gift I've ever received, and I promise to cherish it forever. Thank you for being the most amazing partner, Koko.🫶💕\""
            }
        ];

        function openGift(index) {
            const data = giftData[index];
            document.getElementById('display-img').src = data.img;
            document.getElementById('display-wish').innerHTML = data.wish;
            
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
        }

        function goBack() {
            document.getElementById('page2').classList.add('hidden');
            document.getElementById('page1').classList.remove('hidden');
        }

        // Floating Hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }
        setInterval(createHeart, 300);
    </script>
</body>
</html>
